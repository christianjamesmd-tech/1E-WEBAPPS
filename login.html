<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - OMSU Student Portal</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page">
<div class="auth-card">
<div class="auth-logo">O</div><span class="badge">OMSU STUDENT PORTAL</span><h1>Welcome Back!</h1><p class="auth-subtitle">Log in to access your student portal.</p>
<form id="loginForm"><label>Username</label><input type="text" id="loginUsername" placeholder="Enter your username" required><label>Password</label><input type="password" id="loginPassword" placeholder="Enter your password" required><button class="primary-btn full" type="submit">Login</button><p id="loginMessage" class="form-message"></p></form>
<p class="switch-auth">Don't have an account? <a href="signup.html">Sign Up</a></p>
</div><script src="script.js"></script></body></html>
