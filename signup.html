<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign Up - OMSU Student Portal</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page">
<div class="auth-card">
<div class="auth-logo">O</div><span class="badge">CREATE ACCOUNT</span><h1>Student Sign Up</h1><p class="auth-subtitle">Create your account to use the portal.</p>
<form id="signupForm"><label>Full Name</label><input type="text" id="signupName" placeholder="Enter your full name" required><label>Username</label><input type="text" id="signupUsername" placeholder="Create a username" required><label>Password</label><input type="password" id="signupPassword" placeholder="Create a password" required><label>Confirm Password</label><input type="password" id="signupConfirm" placeholder="Repeat your password" required><button class="primary-btn full" type="submit">Create Account</button><p id="signupMessage" class="form-message"></p></form>
<p class="switch-auth">Already have an account? <a href="login.html">Login</a></p></div><script src="script.js"></script></body></html>
